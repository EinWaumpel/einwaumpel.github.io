<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futuristic Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #0f0c29, #302b63, #24243e);
    font-family: 'Orbitron', sans-serif;
  }

  .calculator {
    background: rgba(0,0,0,0.6);
    border: 2px solid #0ff;
    border-radius: 20px;
    padding: 20px;
    width: 320px;
    box-shadow: 0 0 20px #0ff, 0 0 60px #0ff inset;
  }

  .display {
    background: rgba(0,0,0,0.8);
    color: #0ff;
    font-size: 2em;
    text-align: right;
    padding: 10px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: inset 0 0 10px #0ff;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
  }

  button {
    background: rgba(0,0,0,0.7);
    color: #0ff;
    font-size: 1.2em;
    border: 1px solid #0ff;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 0 10px #0ff;
  }

  button:hover {
    background: #0ff;
    color: #000;
    box-shadow: 0 0 20px #0ff;
  }

  .span-two {
    grid-column: span 2;
  }
</style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button onclick="clearDisplay()">C</button>
      <button onclick="deleteChar()">DEL</button>
      <button onclick="appendOperator('/')">/</button>
      <button onclick="appendOperator('*')">*</button>

      <button onclick="appendNumber(7)">7</button>
      <button onclick="appendNumber(8)">8</button>
      <button onclick="appendNumber(9)">9</button>
      <button onclick="appendOperator('-')">-</button>

      <button onclick="appendNumber(4)">4</button>
      <button onclick="appendNumber(5)">5</button>
      <button onclick="appendNumber(6)">6</button>
      <button onclick="appendOperator('+')">+</button>

      <button onclick="appendNumber(1)">1</button>
      <button onclick="appendNumber(2)">2</button>
      <button onclick="appendNumber(3)">3</button>
      <button onclick="calculate()" style="grid-row: span 2; background:#0ff; color:#000;">=</button>

      <button class="span-two" onclick="appendNumber(0)">0</button>
      <button onclick="appendNumber('.')">.</button>
    </div>
  </div>

<script>
  const display = document.getElementById('display');
  let currentInput = '';

  function appendNumber(num) {
    if (num === '.' && currentInput.includes('.')) return;
    currentInput += num;
    updateDisplay();
  }

  function appendOperator(op) {
    if (currentInput === '' && op !== '-') return;
    const lastChar = currentInput.slice(-1);
    if ('+-*/'.includes(lastChar)) {
      currentInput = currentInput.slice(0, -1) + op;
    } else {
      currentInput += op;
    }
    updateDisplay();
  }

  function clearDisplay() {
    currentInput = '';
    updateDisplay();
  }

  function deleteChar() {
    currentInput = currentInput.slice(0, -1);
    updateDisplay();
  }

  function calculate() {
    try {
      currentInput = eval(currentInput).toString();
    } catch {
      currentInput = 'Error';
    }
    updateDisplay();
  }

  function updateDisplay() {
    display.textContent = currentInput || '0';
  }
</script>
</body>
</html>
